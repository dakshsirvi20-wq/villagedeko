<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Deko - Asli Gaon aur Sanskriti</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase v9 Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD4ABiWBvNQdKXFOO4PcUyjiFBvho55We4",
        authDomain: "bhanaram-1308b.firebaseapp.com",
        projectId: "bhanaram-1308b",
        storageBucket: "bhanaram-1308b.firebasestorage.app",
        messagingSenderId: "245762338349",
        appId: "1:245762338349:web:7baad83bb807f4008212a4",
        measurementId: "G-5WG8JCVM2Y"
      };

      // Initialize Firebase safely
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const auth = firebase.auth();
      const db = firebase.firestore();

      window.auth = auth;
      window.db = db;

      window.switchTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        const activeTab = document.getElementById('tab-' + tabId);
        if (activeTab) {
          activeTab.classList.remove('hidden');
        }
      };

      window.openModal = function(modalId) {
        const modal = document.getElementById(modalId);
        if(modal) modal.style.display = 'block';
      };

      window.closeModal = function(modalId) {
        const modal = document.getElementById(modalId);
        if(modal) modal.style.display = 'none';
      };

      // Auth State Observer
      document.addEventListener("DOMContentLoaded", () => {
        const loginOverlay = document.getElementById('login-overlay');
        
        auth.onAuthStateChanged((user) => {
          const profileNameEl = document.getElementById('profileUserName');
          const profileEmailEl = document.getElementById('profileUserEmail');
          const profileUidEl = document.getElementById('profileUserUid');
          const authActionBtn = document.getElementById('authActionBtn');

          if (user) {
            if(loginOverlay) loginOverlay.style.display = 'none';
            if(profileNameEl) profileNameEl.innerText = user.displayName || user.email?.split('@')[0] || 'User';
            if(profileEmailEl) profileEmailEl.innerText = user.email || "";
            if(profileUidEl) profileUidEl.innerText = "UID: " + user.uid;
            if(authActionBtn) {
              authActionBtn.innerText = "Sign Out";
              authActionBtn.onclick = () => auth.signOut();
            }
            if(typeof loadChaupalPosts === 'function') loadChaupalPosts();
            if(typeof loadVillagesListings === 'function') loadVillagesListings();
          } else {
            if(loginOverlay) loginOverlay.style.display = 'flex';
            if(profileNameEl) profileNameEl.innerText = "Guest User (Not Logged In)";
            if(profileEmailEl) profileEmailEl.innerText = "Please sign in to manage bookings";
            if(profileUidEl) profileUidEl.innerText = "Status: Guest Mode";
            if(authActionBtn) {
              authActionBtn.innerText = "Sign In / Login";
              authActionBtn.onclick = () => { if(loginOverlay) loginOverlay.style.display = 'flex'; };
            }
          }
        });
      });
    </script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f1f5f9;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(4px);
      }
      .modal-content {
        background-color: #ffffff;
        margin: 5% auto;
        padding: 24px;
        border-radius: 24px;
        max-width: 680px;
        width: 92%;
        position: relative;
        box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.15);
        max-height: 88vh;
        overflow-y: auto;
      }
      .hidden { display: none !important; }
      .post-image {
        width: 100%;
        height: auto;
        max-height: 500px;
        object-fit: cover;
        background-color: #f8fafc;
        border-radius: 16px;
      }
    </style>
</head>
<body class="text-slate-900 antialiased pb-24">

    <!-- Full-Screen Login Overlay -->
    <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.98); z-index: 99999; display: flex; justify-content: center; align-items: center; font-family: sans-serif;">
      <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; width: 90%; max-width: 360px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border-radius: 14px; background: #ffffff; box-sizing: border-box;">
        
        <div class="w-14 h-14 rounded-2xl bg-amber-600 flex items-center justify-center text-white font-black text-2xl mb-1 shadow-md">🌾</div>
        <h2 style="margin: 0 0 4px 0; font-size: 22px; color: #111; font-weight: bold; text-align: center;">Welcome to VillageDeko</h2>
        <p id="instruction-text" style="margin: 0 0 10px 0; font-size: 13px; color: #666; text-align: center;">Login via Email or Google</p>

        <!-- Email Input Field -->
        <input type="email" id="userEmailInput" placeholder="Enter your Email" style="padding: 12px 14px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; outline: none;">
        
        <!-- Password Input Field -->
        <input type="password" id="userPasswordInput" placeholder="Enter your Password" style="padding: 12px 14px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; outline: none;">

        <!-- Email Login / Signup Button -->
        <button type="button" onclick="handleEmailLogin()" style="padding: 12px; width: 100%; background: #0095f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">Continue with Email</button>
        
        <div style="width: 100%; text-align: center; font-size: 12px; color: #888; margin: 6px 0;">OR</div>

        <!-- Google Login Button -->
        <button type="button" onclick="handleGoogleLogin()" style="padding: 12px; width: 100%; background: #fff; color: #333; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">Continue with Google</button>
      
      </div>
    </div>

    <script>
      function handleEmailLogin() {
        const email = document.getElementById('userEmailInput').value.trim();
        const password = document.getElementById('userPasswordInput').value.trim();
        
        if(!email || !password) {
          alert("Please enter both Email and Password!");
          return;
        }

        window.auth.signInWithEmailAndPassword(email, password)
          .then(() => {
            alert("Login Successful!");
            document.getElementById('login-overlay').style.display = 'none';
          })
          .catch(() => {
            // Agar account nahi hai toh naya bana do
            window.auth.createUserWithEmailAndPassword(email, password)
              .then(() => {
                alert("Account created and logged in!");
                document.getElementById('login-overlay').style.display = 'none';
              })
              .catch(err => alert(err.message));
          });
      }

      function handleGoogleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        window.auth.signInWithPopup(provider)
          .then((result) => {
            document.getElementById('login-overlay').style.display = 'none';
          })
          .catch((error) => {
            console.warn("Popup blocked, trying redirect method...", error);
            window.auth.signInWithRedirect(provider).catch((redirectError) => {
              alert("Google Login Error: " + redirectError.message);
            });
          });
      } 
    </script>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
      <div class="max-w-3xl mx-auto px-4 py-3 space-y-2.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-amber-600 flex items-center justify-center text-white font-black text-lg shadow-sm">🌾</div>
            <div>
              <h1 class="text-base font-extrabold tracking-tight text-slate-900 leading-none"><span class="text-amber-700">Village</span>Deko</h1>
              <span class="text-[10px] font-bold text-slate-500">Village View</span>
            </div>
          </div>
          <div>
            <select class="text-xs bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-slate-700 outline-none">
              <option value="All">All States</option>
              <option value="Rajasthan" selected>Rajasthan</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Maharashtra">Maharashtra</option>
            </select>
          </div>
        </div>

        <div class="flex items-center justify-center gap-2 bg-slate-100 p-1 rounded-2xl border border-slate-200">
          <button type="button" onclick="switchTab('villages')" class="tab-btn flex-1 py-1.5 rounded-xl bg-amber-600 text-white font-extrabold text-xs shadow-xs transition-all text-center">Villages</button>
          <button type="button" onclick="switchTab('villageWedding')" class="tab-btn flex-1 py-1.5 rounded-xl text-slate-700 font-extrabold text-xs transition-all text-center">Weddings</button>
          <button type="button" onclick="switchTab('chaupal')" class="tab-btn flex-1 py-1.5 rounded-xl text-slate-700 font-extrabold text-xs transition-all text-center">Chaupal</button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto p-4 space-y-4">
      <div id="tab-villages" class="tab-content space-y-4">
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2">
          <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Search Destination</label>
          <input type="text" placeholder="Search by Village, District or State..." class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium">
        </div>
        <div id="villagesFeedContainer" class="space-y-4"></div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-6 z-50 flex justify-around items-center max-w-3xl mx-auto shadow-2xl">
      <button type="button" onclick="switchTab('villages')" class="flex flex-col items-center text-amber-700 font-bold"><span class="text-xl">🏡</span><span class="text-[10px]">Home</span></button>
      <button type="button" onclick="switchTab('villageWedding')" class="flex flex-col items-center text-slate-600 font-bold"><span class="text-xl">💍</span><span class="text-[10px]">Weddings</span></button>
      <button type="button" onclick="switchTab('chaupal')" class="flex flex-col items-center text-slate-600 font-bold"><span class="text-xl">🔥</span><span class="text-[10px]">Chaupal</span></button>
      <button type="button" onclick="openModal('profileModal')" class="flex flex-col items-center text-slate-600 font-bold"><span class="text-xl">👤</span><span class="text-[10px]">Profile</span></button>
    </nav>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h3 class="font-extrabold text-slate-900 text-sm">Platform Dashboard & User Info</h3>
          <button type="button" onclick="closeModal('profileModal')" class="text-slate-400 font-bold text-xl">&times;</button>
        </div>
        <div class="space-y-3">
          <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl space-y-2">
            <div>
              <p class="text-[10px] font-bold text-amber-800 uppercase">Active Account Details</p>
              <p id="profileUserName" class="text-sm font-black text-slate-900">Guest User</p>
              <p id="profileUserEmail" class="text-xs text-slate-600">Please sign in</p>
              <p id="profileUserUid" class="text-[11px] font-mono text-amber-800">Status: Guest Mode</p>
            </div>
            <button type="button" id="authActionBtn" class="w-full py-2 bg-amber-600 text-white font-bold rounded-xl text-xs shadow-sm">Sign In / Login</button>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
