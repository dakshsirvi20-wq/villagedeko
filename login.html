<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VillageDeko - Login</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="login-body">

  <main class="login-page">
    <section class="login-card">

      <div class="logo">🌾</div>

      <h1><span>Village</span>Deko</h1>
      <p class="subtitle">Asli Gaon aur Sanskriti</p>

      <div id="authMessage" class="message hidden"></div>

      <!-- EMAIL / PHONE -->
      <div class="method-tabs">

        <button
          id="emailTab"
          class="method-tab active"
          onclick="switchMethod('email')">
          📧 Email
        </button>

        <button
          id="phoneTab"
          class="method-tab"
          onclick="switchMethod('phone')">
          📱 Phone
        </button>

      </div>

      <div class="method-panel">

        <!-- EMAIL LOGIN -->
        <div id="emailPanel">

          <input
            id="email"
            type="email"
            placeholder="Email address"
            autocomplete="email">

          <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password">

          <button
            id="emailLoginBtn"
            class="primary-btn"
            onclick="emailLogin()">
            Login
          </button>

          <button
            id="createAccountBtn"
            class="secondary-btn"
            onclick="createAccount()">
            Create New Account
          </button>

        </div>


        <!-- PHONE LOGIN -->
        <div id="phonePanel" class="hidden">

          <div id="phoneInputBox">

            <input
              id="phone"
              type="tel"
              placeholder="9876543210"
              autocomplete="tel"
              inputmode="tel">

          </div>

          <div id="otpBox" class="hidden">

            <input
              id="otp"
              type="text"
              inputmode="numeric"
              maxlength="6"
              placeholder="6 digit OTP"
              autocomplete="one-time-code">

          </div>

          <button
            id="sendOtpBtn"
            class="primary-btn"
            onclick="sendOtp()">
            Send OTP
          </button>

          <button
            id="verifyOtpBtn"
            class="primary-btn hidden"
            onclick="verifyOtp()">
            Verify OTP
          </button>

          <button
            id="changePhoneBtn"
            class="secondary-btn hidden"
            onclick="changePhone()">
            Change Phone Number
          </button>

          <div id="recaptcha-container"></div>

        </div>

      </div>


      <!-- GOOGLE LOGIN -->
      <div class="or-divider">
        <span>OR</span>
      </div>

      <button
        id="googleLoginBtn"
        class="google-btn"
        onclick="googleLogin()">

        <span class="google-icon">G</span>

        Continue with Google

      </button>


      <p class="login-note">
        Email, Phone ya Google se login karein.
      </p>

    </section>
  </main>


  <script type="module" src="./auth.js"></script>

</body>
</html>
